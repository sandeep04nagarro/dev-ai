version: 0.2

env:
  shell: bash

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - export ECR_REGISTRY=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - export REPOSITORY_URI=$ECR_REGISTRY/dev-ai-agents
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
  build:
    commands:
      - docker build -t $REPOSITORY_URI:openswe-$CODEBUILD_RESOLVED_SOURCE_VERSION .
  post_build:
    commands:
      - docker push $REPOSITORY_URI:openswe-$CODEBUILD_RESOLVED_SOURCE_VERSION
      - mkdir -p dist/scripts
      - echo "$REPOSITORY_URI:openswe-$CODEBUILD_RESOLVED_SOURCE_VERSION" > dist/image_uri.txt
      - cp appspec.yml dist/appspec.yml
      - cp scripts/pull-image.sh dist/scripts/pull-image.sh
      - cat dist/image_uri.txt

artifacts:
  base-directory: dist
  files:
    - '**/*'
