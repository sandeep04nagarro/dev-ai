version: 0.2

env:
  shell: bash

phases:
  pre_build:
    commands:
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_REPOSITORY_URL
  build:
    commands:
      - docker build -t $ECR_REPOSITORY_URL:openswe-$CODEBUILD_RESOLVED_SOURCE_VERSION -t $ECR_REPOSITORY_URL:openswe-latest .
  post_build:
    commands:
      - docker push $ECR_REPOSITORY_URL:openswe-$CODEBUILD_RESOLVED_SOURCE_VERSION
      - docker push $ECR_REPOSITORY_URL:openswe-latest
      - mkdir -p dist/scripts
      - echo "$ECR_REPOSITORY_URL:openswe-$CODEBUILD_RESOLVED_SOURCE_VERSION" > dist/image_uri.txt
      - cp appspec.yml dist/appspec.yml
      - cp scripts/pull-image.sh dist/scripts/pull-image.sh
      - cat dist/image_uri.txt

artifacts:
  base-directory: dist
  files:
    - '**/*'
