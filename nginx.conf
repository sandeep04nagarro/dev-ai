events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        # 1. Route all tRPC calls through the DevAIAgent proxy (port 8000). The
        # proxy itself forwards to Langfuse (port 3000) first and only rewrites
        # the response for the ops it knows how to serve from the S3 archive
        # (agent/langfuse_proxy.py: intercept_ops), passing everything else
        # through untouched. Keeping the intercept list in one place (Python)
        # instead of mirrored here in a regex avoids it silently drifting out
        # of sync, which is what caused observations.byId and
        # traces.getAgentGraphData to bypass the proxy entirely.
        location ~ ^/api/trpc/ {
            proxy_pass http://host.docker.internal:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 2. Route EVERYTHING ELSE to Langfuse (port 3000)
        location / {
            proxy_pass http://host.docker.internal:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # WebSocket support for Langfuse (Next.js hot reload / UI updates)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
